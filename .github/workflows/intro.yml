name: Refresh intro

# Regenerate Poof's cached homepage intro after every successful production
# deploy, so the first message always reflects the deployed content. Vercel's
# build runs `convex deploy`, so this must wait for the deploy: on a plain push
# trigger it raced the build and called functions that did not exist yet. Convex
# skips the model call when this content (and prompt version) was already
# introduced, so a deploy that changed neither costs one no-op call.
# Also runnable on demand via the Actions tab (workflow_dispatch).
on:
  deployment_status: {}
  workflow_dispatch: {}

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22
  HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}

jobs:
  refresh:
    name: Refresh the prod intro
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    # Job-level, so only runs that pass the `if` join the group: every deployment_status event
    # (previews, `pending`) starts a run, and a workflow-level group would let one of those
    # cancel a prod refresh that is queued behind a running one.
    concurrency:
      group: intro-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit Vercel just deployed, so the corpus matches what visitors are served.
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check deploy key is configured
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY secret is not set. Add a PRODUCTION deploy key (Convex dashboard > Prod deployment > Settings > Deploy Keys) as the CONVEX_DEPLOY_KEY repo secret."
            exit 1
          fi

      - name: Refresh the prod intro
        # CONVEX_DEPLOY_KEY must be a PRODUCTION deploy key. The Convex CLI is then
        # scoped to that deployment, so `npx convex run intro:refreshIntro` inside
        # scripts/refresh-intro.ts targets prod. We call the script directly rather
        # than `pnpm intro:refresh`, which wraps it in `dotenv -e .env.local` (absent in CI).
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm tsx scripts/refresh-intro.ts
