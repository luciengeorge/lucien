name: Refresh intro

# Regenerate Poof's cached homepage intro whenever content/ (or the intro code)
# lands on main, so the first message always reflects the current content. The
# chat itself reads content/ directly and needs nothing here. Convex skips the
# model call when this content was already introduced, so reruns are free.
# Also runnable on demand via the Actions tab (workflow_dispatch), e.g. after a
# manual `npx convex deploy` that bumped the intro prompt version.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/refresh-intro.ts"
      - "convex/intro.ts"
      - ".github/workflows/intro.yml"
  workflow_dispatch: {}

concurrency:
  group: intro-prod
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22
  HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}

jobs:
  refresh:
    name: Refresh the prod intro
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check deploy key is configured
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY secret is not set. Add a PRODUCTION deploy key (Convex dashboard > Prod deployment > Settings > Deploy Keys) as the CONVEX_DEPLOY_KEY repo secret."
            exit 1
          fi

      - name: Refresh the prod intro
        # CONVEX_DEPLOY_KEY must be a PRODUCTION deploy key. The Convex CLI is then
        # scoped to that deployment, so `npx convex run intro:refreshIntro` inside
        # scripts/refresh-intro.ts targets prod. We call the script directly rather
        # than `pnpm intro:refresh`, which wraps it in `dotenv -e .env.local` (absent in CI).
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm tsx scripts/refresh-intro.ts
